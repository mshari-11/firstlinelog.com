<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLL Admin Console</title>
    <link rel="icon" type="image/x-icon" href="/public/favicon.ico" />
    <style>
      /* Instant background — prevents flash before CSS loads */
      html, body { margin: 0; }
      body { background: #0f2744; }
      html.fll-dark body { background: #0C0E14; }
    </style>
  </head>
  <body>
    <script>
      // Set dark bg immediately for admin panel routes
      // Uses documentElement (html) because Vite moves scripts to <head> during build
      if (location.pathname.indexOf('/admin-panel') === 0) {
        document.documentElement.classList.add('fll-dark');
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
